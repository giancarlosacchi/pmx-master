name: Supabase keep-alive

# Ping giornaliero al database Supabase: mantiene il progetto Free "attivo"
# così non viene mai messo in pausa per inattività (7 giorni), nemmeno in ferie.
# Il 1° del mese fa anche un commit vuoto: GitHub disattiva i cron nei repo
# senza attività da 60 giorni, e il commit li tiene vivi.

on:
  schedule:
    - cron: '17 6 * * *'   # ogni giorno alle 06:17 UTC (08:17 italiane)
  workflow_dispatch: {}     # avviabile anche a mano dalla tab Actions

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://ngtyjxcjodwwznatubjm.supabase.co
      # Chiave "anon": è pubblica per design (è già nel sito), nessun segreto esposto qui.
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ndHlqeGNqb2R3d3puYXR1YmptIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4NzkwMzUsImV4cCI6MjA5NTQ1NTAzNX0.xIFSL1dBB9T5A1DrwxZV9Z1TVoLflnEaxLzkYLvTpC8
    steps:
      - name: Ping database (evita la pausa del piano Free)
        run: |
          set -e
          echo "Ping 1: query REST su allowed_users…"
          if curl -sS --fail -m 30 \
               "$SUPABASE_URL/rest/v1/allowed_users?select=email&limit=1" \
               -H "apikey: $SUPABASE_ANON_KEY" \
               -H "Authorization: Bearer $SUPABASE_ANON_KEY" -o /dev/null; then
            echo "OK: il database ha risposto."
          else
            echo "Query tabella fallita, provo l'endpoint REST generico…"
            curl -sS --fail -m 30 "$SUPABASE_URL/rest/v1/" \
              -H "apikey: $SUPABASE_ANON_KEY" -o /dev/null
            echo "OK: endpoint REST raggiungibile."
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Commit vuoto mensile (tiene attivo questo cron)
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            git config user.name  "keepalive"
            git config user.email "actions@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep-alive mensile (mantiene attivi cron e sito)"
            git push
            echo "Commit keep-alive eseguito."
          else
            echo "Non è il 1° del mese: nessun commit."
          fi
